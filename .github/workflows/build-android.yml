name: Build Android APK

# Builds mobile/android → JSE-<ver>.apk and, when called from release.yml with a tag,
# attaches it to that GitHub Release.
# Signing: secrets ANDROID_KEYSTORE_BASE64 + ANDROID_KEYSTORE_PASSWORD (optional ANDROID_KEY_ALIAS,
# default "jse"; ANDROID_KEY_PASSWORD, default = keystore password).  Without them the APK is signed
# with a debug key (installable, but a later release-signed APK will not install over it).

on:
  workflow_call:
    inputs:
      tag:
        description: 'Release tag to attach the files to (empty = artifacts only)'
        type: string
        required: false
        default: ''
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'
          log-accepted-android-sdk-licenses: false

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          package-manager-cache: false

      - name: Read version
        id: meta
        run: |
          VERSION=$(node -p "require('./app/version.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION"

      - name: Install Capacitor project dependencies
        working-directory: mobile
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install --no-audit --no-fund; fi

      - name: Fill in update_base_url if still the placeholder
        run: |
          FILE=mobile/android/app/src/main/res/values/strings.xml
          if grep -q 'REPLACE_GITHUB_OWNER' "$FILE"; then
            sed -i "s#https://REPLACE_GITHUB_OWNER.github.io/jse/#https://${OWNER}.github.io/${REPO}/#g" "$FILE"
            echo "::warning::update_base_url in strings.xml was the placeholder — using https://${OWNER}.github.io/${REPO}/ for this build (commit the change to silence this)"
          fi
          grep update_base_url "$FILE"
        env:
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}

      - name: Generate launcher icons
        working-directory: mobile
        run: |
          npm i --no-save sharp
          node scripts/make-android-icons.mjs

      - name: Copy web app + shim into www/ and sync the Android project
        working-directory: mobile
        run: npm run sync

      - name: Gradle wrapper (generate when missing)
        working-directory: mobile/android
        run: |
          if [ ! -f gradlew ]; then
            gradle wrapper --gradle-version 8.7 --distribution-type bin --no-daemon
          fi
          chmod +x gradlew
          ./gradlew --version

      - name: Prepare release keystore
        id: keystore
        run: |
          set -uo pipefail
          if [ -n "${ANDROID_KEYSTORE_BASE64}" ]; then
            # tolerate spaces / line breaks picked up while copy-pasting the secrets
            if ! printf '%s' "${ANDROID_KEYSTORE_BASE64}" | tr -d ' \r\n\t' | base64 -d > "${RUNNER_TEMP}/release.keystore" 2>/dev/null; then
              echo "::error::ANDROID_KEYSTORE_BASE64 is not valid base64 — paste the whole (very long) line again."; exit 1
            fi
            PW=$(printf '%s' "${ANDROID_KEYSTORE_PASSWORD}" | tr -d ' \r\n\t')
            KPW=$(printf '%s' "${ANDROID_KEY_PASSWORD:-$PW}" | tr -d ' \r\n\t')
            ALIAS="${ANDROID_KEY_ALIAS:-jse}"
            if [ -z "$PW" ]; then echo "::error::ANDROID_KEYSTORE_PASSWORD secret is empty or missing."; exit 1; fi
            if ! keytool -list -keystore "${RUNNER_TEMP}/release.keystore" -storepass "$PW" -alias "$ALIAS" >/dev/null 2>&1; then
              echo "::error::The keystore cannot be opened with ANDROID_KEYSTORE_PASSWORD (alias '$ALIAS'). Check both secrets."; exit 1
            fi
            {
              echo "KEYSTORE_PATH=${RUNNER_TEMP}/release.keystore"
              echo "KEYSTORE_PASSWORD=$PW"
              echo "KEY_ALIAS=$ALIAS"
              echo "KEY_PASSWORD=$KPW"
            } >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "Release keystore: provided and verified"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            if [ -n "${VAR_KEYSTORE}" ] || [ -n "${VAR_PASSWORD}" ]; then
              echo "::warning::The signing key was saved as an Actions VARIABLE, not a SECRET, so it is not used. Settings → Secrets and variables → Actions → 'Secrets' tab → New repository secret (then delete the variables)."
            fi
            echo "::warning::ANDROID_KEYSTORE_BASE64 secret is not set — the APK will be signed with a DEBUG key. Add the secrets described in RELEASING.md for a distributable build."
          fi
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VAR_KEYSTORE: ${{ vars.ANDROID_KEYSTORE_BASE64 != '' && 'yes' || '' }}
          VAR_PASSWORD: ${{ vars.ANDROID_KEYSTORE_PASSWORD != '' && 'yes' || '' }}

      - name: Build release APK
        working-directory: mobile/android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Collect APK
        id: apk
        run: |
          set -euo pipefail
          VERSION="${{ steps.meta.outputs.version }}"
          mkdir -p out
          APK=$(find mobile/android/app/build/outputs/apk/release -name '*.apk' ! -name '*unsigned*' | head -n 1)
          test -n "$APK" || { echo "::error::no APK produced"; exit 1; }
          cp "$APK" "out/JSE-${VERSION}.apk"
          ls -la out
          echo "path=out/JSE-${VERSION}.apk" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v6
        with:
          name: JSE-android
          path: out/*.apk
          if-no-files-found: error

      # A debug-signed APK gets a small marker file next to it in the release; release.yml rebuilds the
      # APK on the next push to main once the signing secrets exist, and the marker is removed then.
      - name: Mark a debug-signed APK
        if: (inputs.tag != '' || startsWith(github.ref, 'refs/tags/v')) && steps.keystore.outputs.signed != 'true'
        run: |
          echo "This APK is signed with a temporary debug key. Add the ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD secrets; the next push to main rebuilds it with the release key." > "out/JSE-${{ steps.meta.outputs.version }}.apk.debug-key.txt"

      - name: Attach APK to the GitHub Release
        if: inputs.tag != '' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag != '' && inputs.tag || github.ref_name }}
          files: out/JSE-${{ steps.meta.outputs.version }}.apk*
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Remove the debug-key marker (release-signed now)
        if: (inputs.tag != '' || startsWith(github.ref, 'refs/tags/v')) && steps.keystore.outputs.signed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag != '' && inputs.tag || github.ref_name }}
        run: gh release delete-asset "$TAG" "JSE-${{ steps.meta.outputs.version }}.apk.debug-key.txt" --repo "$GITHUB_REPOSITORY" -y || true
